<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Engineering Chatbot</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg:#0d1526; --panel:#17213a; --panel2:#1b2644; --line:#2b3a5e; --user:#c62f3a; --bot:#f59e0b; --text:#e8ecf5; --muted:#9aa6c0; --ok:#34d399; --bad:#f87171; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  main { max-width:820px; margin:0 auto; padding:16px; min-height:100vh; display:flex; flex-direction:column; }
  h1 { margin:8px 0 0; font-size:1.7rem; }
  h2 { margin:0 0 8px; font-size:1.05rem; }
  .sub { color:var(--muted); font-size:.9rem; margin:2px 0 14px; }
  .kb { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:14px; }
  .drop { display:block; border:2px dashed var(--line); border-radius:12px; padding:18px; text-align:center; cursor:pointer; color:var(--muted); }
  .drop:hover, .drop.over { border-color:var(--bot); color:var(--text); }
  .drop input { display:none; }
  .drop b { color:var(--text); }
  .docs { list-style:none; margin:10px 0 0; padding:0; display:flex; flex-direction:column; gap:6px; }
  .docs li { display:flex; align-items:center; gap:8px; background:var(--panel2); border-radius:8px; padding:6px 10px; font-size:.9rem; }
  .docs .name { flex:1; overflow-wrap:anywhere; } .docs .meta { color:var(--muted); font-size:.8rem; white-space:nowrap; }
  .docs button, .link { background:none; border:0; color:var(--bad); cursor:pointer; font-size:.85rem; }
  .row2 { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; margin-top:10px; font-size:.88rem; color:var(--muted); }
  .row2 label { cursor:pointer; display:flex; gap:6px; align-items:center; }
  #status { min-height:1.4em; font-size:.88rem; color:var(--muted); margin-top:8px; }
  #status.ok { color:var(--ok); } #status.err { color:var(--bad); }
  #chat { flex:1; display:flex; flex-direction:column; gap:10px; padding-bottom:12px; }
  .row { display:flex; gap:10px; align-items:flex-start; }
  .avatar { flex:none; width:34px; height:34px; border-radius:8px; display:grid; place-items:center; font-size:18px; }
  .row.user .avatar { background:var(--user); } .row.bot .avatar { background:var(--bot); }
  .bubble { background:var(--panel); border-radius:12px; padding:8px 12px; max-width:calc(100% - 46px); overflow-wrap:anywhere; }
  .bubble p { margin:0 0 .4em; } .bubble p:last-child { margin:0; }
  .src { color:var(--muted); font-size:.8rem; margin-top:6px; }
  details { margin-top:6px; color:var(--muted); font-size:.85rem; } details pre { white-space:pre-wrap; margin:6px 0 0; font:inherit; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 12px; }
  .chip { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:999px; padding:6px 12px; cursor:pointer; font-size:.85rem; }
  .chip:hover { border-color:var(--bot); }
  form { position:sticky; bottom:0; display:flex; gap:8px; padding:12px 0 16px; background:linear-gradient(transparent, var(--bg) 30%); }
  input[type=text] { flex:1; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--panel2); color:var(--text); font-size:1rem; }
  button.send { padding:0 18px; border:0; border-radius:12px; background:var(--bot); color:#111; font-weight:600; cursor:pointer; font-size:1rem; }
</style>
</head>
<body>
<main>
  <h1>⚡ Engineering Chatbot</h1>
  <div class="sub">Upload your documents, then ask questions about them. Everything runs in your browser.</div>

  <section class="kb">
    <h2>📚 Knowledge base</h2>
    <label class="drop" id="drop">
      <input id="file" type="file" multiple accept=".pdf,.docx,.txt,.md,.csv,.tsv,.json,.html,.htm">
      <b>Click to choose files</b> or drag and drop them here<br>
      <span style="font-size:.85rem">PDF, Word (.docx), text, Markdown, CSV</span>
    </label>
    <ul class="docs" id="docs"></ul>
    <div class="row2">
      <label id="builtinLabel" style="display:none"><input type="checkbox" id="builtin" checked> Also use the built-in UniZulu timetable, calendar and handbook</label>
      <button class="link" id="clear" type="button" style="display:none">Remove all uploaded documents</button>
    </div>
    <div id="status">Loading…</div>
  </section>

  <div class="chips" id="chips"></div>
  <div id="chat"></div>
  <form id="form" autocomplete="off">
    <input type="text" id="q" placeholder="Ask a question about your documents..." aria-label="Your question">
    <button class="send" type="submit">Send</button>
  </form>
</main>

<script>
/* ======================================================================
   ENGINE  (works in the browser and in Node, so it can be tested)
   ====================================================================== */
const NO_ANSWER = "I couldn't find that in the documents in the knowledge base. Try rephrasing, or upload a document that covers it.";
const EMPTY_KB = "The knowledge base is empty. Upload a document first (PDF, Word, text), then ask your question.";
const DAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const DAY_WORDS = {monday:"Monday",mon:"Monday",tuesday:"Tuesday",tue:"Tuesday",tues:"Tuesday",wednesday:"Wednesday",wed:"Wednesday",
  thursday:"Thursday",thu:"Thursday",thur:"Thursday",thurs:"Thursday",friday:"Friday",fri:"Friday",saturday:"Saturday",sat:"Saturday",sunday:"Sunday",sun:"Sunday"};
const MONTHS = ["JANUARY","FEBRUARY","MARCH","APRIL","MAY","JUNE","JULY","AUGUST","SEPTEMBER","OCTOBER","NOVEMBER","DECEMBER"];
const MONTH_INDEX = Object.fromEntries(MONTHS.map((m,i)=>[m,i]));
const CODE_RE = /\b\d[A-Z]{2,4}\d{2,3}[A-Z]?\b/;
const CODE_RE_G = /\b\d[A-Z]{2,4}\d{2,3}[A-Z]?\b/g;
const SCHEDULE_WORDS = new Set(["time","times","when","schedule","scheduled","timetable","class","classes","lecture","lectures","tutorial","tutorials","practical","practicals","venue","period","periods","slot","slots","meet","meets"]);
const CAL_TRIGGERS = new Set(["recess","registration","semester","term","exam","exams","examination","examinations","holiday","holidays","closure","graduation","orientation","lecture","lectures","break","deadline","reopen","reopens","open","opens","closes","closing","calendar","special","supplementary","aegrotat"]);
const CAL_STOP = new Set(["is","the","what","when","does","do","did","for","of","on","in","a","an","are","was","were","will","would","can","could","should","to","we","you","your","our","there","here","much","many","get","got","want","shall","have","has","had","date","dates","list","all","every","each","me","please","show","tell","about","start","starts","begin","begins","end","ends","finish","finishes","commence","commences","university","which","how","long","day"]);
const CAL_SYNONYMS = [[/\bfirst semester\b/g,"semester i"],[/\bsecond semester\b/g,"semester ii"],[/\bsemester 1\b/g,"semester i"],[/\bsemester 2\b/g,"semester ii"],
  [/\bterm 1\b/g,"term i"],[/\bterm 2\b/g,"term ii"],[/\bterm 3\b/g,"term iii"],[/\bterm 4\b/g,"term iv"],[/\bholidays?\b/g,"public holiday"],
  [/\bbreak\b/g,"recess"],[/\breg\b/g,"registration"],[/\bexams?\b/g,"examinations"]];
const START_WORDS = new Set(["start","starts","begin","begins","commence","commences","open","opens","opening"]);
const END_WORDS = new Set(["end","ends","finish","finishes","close","closes","closing"]);
const HB_STOP = new Set(["what","is","the","a","an","are","of","for","to","in","on","and","or","does","do","did","how","when","which","who","where","can","i","my","me","please","tell","about","need","needed","get","have","has","there"]);
const HB_SYNONYMS = [[/\bmaths?\b/gi,"mathematics"],[/\bmatric\b/gi,"matriculation"],[/\bco-?ordinators?\b/gi,"co-ordinator"],[/\bphysics\b/gi,"physical"]];
const BM25_THRESHOLD = 2.0, MIN_COVERAGE = 0.6;
const CHUNK_SIZE = 800, CHUNK_OVERLAP = 150;

const tokenize = t => t.toLowerCase().match(/[a-z0-9]+/g) || [];
function stem(word, n) {
  let w = word.toLowerCase();
  if (/\d/.test(w)) return w;
  if (w.length > 4 && w.endsWith("s") && !w.endsWith("ss")) w = w.slice(0, -1);
  return w.slice(0, n);
}
const intersectSize = (a, b) => { let c = 0; for (const x of a) if (b.has(x)) c++; return c; };

class BM25 {  // same maths as the rank_bm25 library (Okapi, k1=1.5, b=0.75, epsilon=0.25)
  constructor(corpus, k1 = 1.5, b = 0.75, epsilon = 0.25) {
    this.k1 = k1; this.b = b; this.N = corpus.length;
    this.docs = corpus.map(d => { const m = new Map(); for (const w of d) m.set(w, (m.get(w) || 0) + 1); return m; });
    this.lens = corpus.map(d => d.length);
    this.avgdl = this.N ? this.lens.reduce((s, x) => s + x, 0) / this.N : 1;
    const nd = new Map();
    for (const m of this.docs) for (const w of m.keys()) nd.set(w, (nd.get(w) || 0) + 1);
    this.idf = new Map(); let sum = 0; const negative = [];
    for (const [w, f] of nd) {
      const v = Math.log(this.N - f + 0.5) - Math.log(f + 0.5);
      this.idf.set(w, v); sum += v; if (v < 0) negative.push(w);
    }
    const eps = epsilon * (nd.size ? sum / nd.size : 0);
    for (const w of negative) this.idf.set(w, eps);
  }
  scores(query) {
    const out = new Array(this.N).fill(0);
    for (const q of query) {
      const idf = this.idf.get(q) || 0;
      if (!idf) continue;
      for (let i = 0; i < this.N; i++) {
        const f = this.docs[i].get(q) || 0;
        if (!f) continue;
        out[i] += idf * (f * (this.k1 + 1) / (f + this.k1 * (1 - this.b + this.b * this.lens[i] / this.avgdl)));
      }
    }
    return out;
  }
}

function trimText(text, limit = 900) {
  text = text.replace(/\s+/g, " ").trim();
  if (text.length <= limit) return text;
  const cut = text.slice(0, limit);
  const end = Math.max(cut.lastIndexOf(". "), cut.lastIndexOf("; "), cut.lastIndexOf(": "));
  if (end > 200) return cut.slice(0, end + 1).trim();
  return (cut.slice(0, cut.lastIndexOf(" ")) + " ...").trim();
}

/* ---------------- uploaded documents: chunking + retrieval ---------------- */
function splitSentences(text) {
  const parts = text.match(/[^.!?]+[.!?]+["')\]]*\s*|[^.!?]+$/g) || [text];
  const out = [];
  for (let s of parts) {
    s = s.trim(); if (!s) continue;
    while (s.length > CHUNK_SIZE) {            // very long "sentences" (tables, lists): cut at a space
      let cut = s.lastIndexOf(" ", CHUNK_SIZE); if (cut < CHUNK_SIZE / 2) cut = CHUNK_SIZE;
      out.push(s.slice(0, cut).trim()); s = s.slice(cut).trim();
    }
    if (s) out.push(s);
  }
  return out;
}
function chunkText(text) {   // sentence-aware chunks of about 800 characters with 150 characters of overlap
  text = text.replace(/\s+/g, " ").trim();
  if (!text) return [];
  const chunks = []; let current = [], len = 0;
  for (const sentence of splitSentences(text)) {
    if (current.length && len + sentence.length + 1 > CHUNK_SIZE) {
      chunks.push(current.join(" "));
      const keep = []; let keepLen = 0;
      for (let i = current.length - 1; i >= 0; i--) {
        if (keepLen + current[i].length > CHUNK_OVERLAP) break;
        keep.unshift(current[i]); keepLen += current[i].length + 1;
      }
      current = keep; len = keepLen;
    }
    current.push(sentence); len += sentence.length + 1;
  }
  if (current.length) chunks.push(current.join(" "));
  return chunks;
}
class UploadIndex {
  constructor(docs) {   // docs: [{name, pages:[{page, text}]}]
    this.chunks = [];
    for (const d of docs) for (const p of d.pages) for (const t of chunkText(p.text)) this.chunks.push({doc: d.name, page: p.page, text: t});
    this.stemSets = this.chunks.map(c => new Set(tokenize(c.text).map(w => stem(w, 5))));
    this.bm25 = this.chunks.length ? new BM25(this.chunks.map(c => tokenize(c.text).map(w => stem(w, 5)))) : null;
  }
  get size() { return this.chunks.length; }
}
function retrieveUploads(idx, query, topK = 3) {
  if (!idx || !idx.bm25) return [];
  const qStems = tokenize(query).filter(w => !HB_STOP.has(w)).map(w => stem(w, 5));
  if (!qStems.length) return [];
  const unique = new Set(qStems);
  const scores = idx.bm25.scores(qStems), ranked = [];
  scores.forEach((base, i) => {
    if (base <= 0) return;
    const heading = new Set(tokenize(idx.chunks[i].text.slice(0, 80)).map(t => stem(t, 5)));
    ranked.push([base + 2.0 * intersectSize(heading, unique), i, intersectSize(idx.stemSets[i], unique) / unique.size]);
  });
  ranked.sort((a, b) => b[0] - a[0] || a[1] - b[1]);
  const out = [], seen = [];
  for (const [score, i, coverage] of ranked) {
    if (seen.some(j => idx.chunks[j].doc === idx.chunks[i].doc && Math.abs(i - j) <= 1)) continue;  // skip overlapping neighbours
    out.push({score, coverage, chunk: idx.chunks[i]}); seen.push(i);
    if (out.length >= topK) break;
  }
  return out;
}
const where = c => c.doc + (c.page ? ` (page ${c.page})` : "");

/* ---------------- optional built-in UniZulu data ---------------- */
class KnowledgeBase {
  constructor(timetable, calendar, rawChunks, lines) {
    this.timetable = timetable; this.calendar = calendar; this.lines = lines;
    this.chunks = rawChunks.map(c => c.text); this.chunkStart = rawChunks.map(c => c.start);
    this.calStems = calendar.map(e => new Set(tokenize(e[3]).map(t => stem(t, 4))));
    this.calDf = new Map();
    for (const s of this.calStems) for (const w of s) this.calDf.set(w, (this.calDf.get(w) || 0) + 1);
    this.calN = calendar.length;
    this.bm25 = new BM25(this.chunks.map(c => tokenize(c).map(t => stem(t, 5))));
  }
  calIdf(w) { return Math.log(1 + this.calN / (1 + (this.calDf.get(stem(w, 4)) || 0))); }
}
const findModuleCode = q => { const m = q.toUpperCase().match(CODE_RE); return m ? m[0] : null; };
const findDay = q => { for (const w of tokenize(q)) if (DAY_WORDS[w]) return DAY_WORDS[w]; return null; };
const isScheduleQuestion = q => !!findDay(q) || tokenize(q).some(w => SCHEDULE_WORDS.has(w));
function lookupSchedule(kb, code, day) {
  code = code.toUpperCase();
  let hits = kb.timetable.filter(e => e.code === code || (/\d$/.test(code) && e.code.startsWith(code)));
  if (day) hits = hits.filter(e => e.day === day);
  return hits;
}
function formatSchedule(code, hits, allHits, day) {
  if (!hits.length) {
    if (!allHits.length) return `**${code}** was not found in the timetable.`;
    const days = [...new Set(allHits.map(e => e.day))].sort((a, b) => DAYS.indexOf(a) - DAYS.indexOf(b));
    return `**${code}** does not appear to be scheduled on ${day}. It is scheduled on: ${days.join(", ")}.`;
  }
  const label = e => { let s = e.time; if (e.group) s += ` (Group ${e.group})`; if (e.code !== code) s += ` [${e.code}]`; return s; };
  const byDay = new Map();
  const sorted = [...hits].sort((a, b) => DAYS.indexOf(a.day) - DAYS.indexOf(b.day) || (a.time < b.time ? -1 : a.time > b.time ? 1 : 0) || (a.code < b.code ? -1 : a.code > b.code ? 1 : 0));
  for (const e of sorted) { if (!byDay.has(e.day)) byDay.set(e.day, []); byDay.get(e.day).push(label(e)); }
  if (day) return `**${code}** on ${day}: ${byDay.get(day).join(", ")}`;
  const lines = [`**${code}** is scheduled as follows:`];
  for (const [d, times] of byDay) lines.push(`- ${d}: ${times.join(", ")}`);
  return lines.join("\n");
}
const isCalendarQuery = q => tokenize(q).some(w => CAL_TRIGGERS.has(w));
function searchCalendar(kb, query, maxHits = 3) {
  let q = query.toLowerCase();
  for (const [re, rep] of CAL_SYNONYMS) q = q.replace(re, rep);
  const words = tokenize(q), wordset = new Set(words);
  const intent = words.some(w => START_WORDS.has(w)) ? "start" : words.some(w => END_WORDS.has(w)) ? "end" : null;
  const month = MONTHS.find(m => wordset.has(m.toLowerCase())) || null;
  const content = words.filter(w => !CAL_STOP.has(w) && !DAY_WORDS[w] && !(w.toUpperCase() in MONTH_INDEX));
  const present = content.filter(w => (kb.calDf.get(stem(w, 4)) || 0) >= 1);
  if (!present.length) return [];
  let anchor = present[0];
  for (const w of present) if (kb.calIdf(w) > kb.calIdf(anchor)) anchor = w;
  const scored = [];
  kb.calendar.forEach((event, i) => {
    const stems = kb.calStems[i];
    if (month && event[0] !== month) return;
    const matched = present.filter(w => stems.has(stem(w, 4)));
    if (!matched.length || !stems.has(stem(anchor, 4))) return;
    const textL = event[3].toLowerCase();
    let score = matched.reduce((s, w) => s + kb.calIdf(w), 0) / Math.sqrt(stems.size);
    if (intent === "start" && ["start of", "opening", "university re-opens"].some(p => textL.startsWith(p))) score *= 1.5;
    if (intent === "end" && ["end of", "closure", "last day"].some(p => textL.startsWith(p))) score *= 1.5;
    scored.push([score, event]);
  });
  scored.sort((a, b) => b[0] - a[0] || MONTH_INDEX[a[1][0]] - MONTH_INDEX[b[1][0]] || a[1][1] - b[1][1]);
  if (!scored.length) return [];
  const best = scored[0][0];
  return scored.filter(s => s[0] >= 0.75 * best).slice(0, maxHits).map(s => s[1]);
}
const titleCase = s => s.charAt(0) + s.slice(1).toLowerCase();
const fmtDate = e => `${e[2]} ${e[1]} ${titleCase(e[0])} 2026`;
function formatCalendar(kb, hits) {
  if (!hits.length) return null;
  const sorted = [...hits].sort((a, b) => MONTH_INDEX[a[0]] - MONTH_INDEX[b[0]] || a[1] - b[1]);
  return sorted.map(ev => {
    let line = `- **${fmtDate(ev)}**: ${ev[3]}`;
    const m = ev[3].match(/^start of (.*)$/i);
    if (m) {
      const key = m[1].trim().toLowerCase();
      const ends = kb.calendar.filter(e => e[3].toLowerCase() === `end of ${key}`);
      if (ends.length === 1) line += ` (ends ${fmtDate(ends[0])})`;
    }
    return line;
  }).join("\n");
}
function queryStems(query) {
  for (const [re, rep] of HB_SYNONYMS) query = query.replace(re, rep);
  query = query.toUpperCase().replace(CODE_RE_G, m => /[A-Z]$/.test(m) ? m.slice(0, -1) : m);
  return tokenize(query).filter(w => !HB_STOP.has(w)).map(w => stem(w, 5));
}
function retrieveHandbook(kb, query, topK = 3) {
  const qStems = queryStems(query);
  if (!qStems.length) return [];
  const unique = new Set(qStems);
  const scores = kb.bm25.scores(qStems);
  const boosted = [];
  scores.forEach((base, i) => {
    if (base <= 0) return;
    const heading = new Set(tokenize(kb.chunks[i].slice(0, 80)).map(t => stem(t, 5)));
    const chunkStems = new Set(tokenize(kb.chunks[i]).map(t => stem(t, 5)));
    boosted.push([base + 2.0 * intersectSize(heading, unique), i, intersectSize(chunkStems, unique) / unique.size]);
  });
  boosted.sort((a, b) => b[0] - a[0] || b[1] - a[1]);
  const results = [], taken = [];
  for (const [score, i, coverage] of boosted) {
    if (taken.some(j => Math.abs(i - j) <= 1)) continue;
    results.push([score, kb.chunks[i], coverage, i]); taken.push(i);
    if (results.length >= topK) break;
  }
  return results;
}

/* ---------------- router ---------------- */
function answerQuery(kb, idx, query) {
  query = query.trim();
  if (!query) return {text: "Please type a question.", source: "none", context: []};
  const hasUploads = !!(idx && idx.size);
  if (!kb && !hasUploads) return {text: EMPTY_KB, source: "none", context: []};

  // 1. exact timetable lookup (built-in data only)
  const code = findModuleCode(query);
  if (kb && code && isScheduleQuestion(query)) {
    const day = findDay(query), all = lookupSchedule(kb, code);
    const hits = day ? lookupSchedule(kb, code, day) : all;
    return {text: formatSchedule(code, hits, all, day), source: "timetable", context: []};
  }
  // 2. the documents the user uploaded
  if (hasUploads) {
    const r = retrieveUploads(idx, query);
    if (r.length && r[0].score >= BM25_THRESHOLD && r[0].coverage >= MIN_COVERAGE) {
      const best = r[0].chunk;
      let text = `From **${where(best)}**: ${trimText(best.text, 900)}`;
      const others = [...new Set(r.slice(1).filter(x => x.coverage >= MIN_COVERAGE).map(x => where(x.chunk)))];
      if (others.length) text += `\n\nAlso see: ${others.join("; ")}`;
      return {text, source: "uploaded document", context: r.map(x => `[${where(x.chunk)}] ${x.chunk.text}`)};
    }
  }
  // 3. built-in calendar and handbook
  if (kb) {
    if (isCalendarQuery(query)) {
      const hits = searchCalendar(kb, query), text = formatCalendar(kb, hits);
      if (text) return {text, source: "calendar", context: hits.map(h => `${fmtDate(h)}: ${h[3]}`)};
    }
    const results = retrieveHandbook(kb, query);
    if (results.length && results[0][0] >= BM25_THRESHOLD && results[0][2] >= MIN_COVERAGE) {
      const start = kb.chunkStart[results[0][3]];
      let section = kb.lines.slice(start, start + 16).join(" ");
      const nxt = section.indexOf(" Title ", 10);
      if (nxt !== -1) section = section.slice(0, nxt);
      return {text: "According to the handbook: " + trimText(section, 900), source: "handbook", context: results.map(r => r[1])};
    }
  }
  return {text: NO_ANSWER, source: "none", context: []};
}

if (typeof globalThis !== "undefined") globalThis.__chatbot = {KnowledgeBase, UploadIndex, answerQuery, chunkText, retrieveUploads};

/* ======================================================================
   PAGE  (browser only)
   ====================================================================== */
if (typeof document !== "undefined") (function () {
  const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
  const PDFJS_WORKER = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const MAMMOTH = "https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js";

  const $ = id => document.getElementById(id);
  const chat = $("chat"), statusEl = $("status"), docsEl = $("docs");
  let builtin = null, docs = [], idx = new UploadIndex([]), canPersist = true;

  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  function setStatus(msg, kind) { statusEl.textContent = msg; statusEl.className = kind || ""; }

  /* ---- remembering uploads in this browser (IndexedDB) ---- */
  function openDb() {
    return new Promise((res, rej) => {
      const r = indexedDB.open("engineering-chatbot", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("docs", {keyPath: "name"});
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
  }
  async function dbRun(mode, fn) {
    const db = await openDb();
    return new Promise((res, rej) => {
      const tx = db.transaction("docs", mode), req = fn(tx.objectStore("docs"));
      tx.oncomplete = () => { db.close(); res(req && req.result); }; tx.onerror = () => rej(tx.error);
    });
  }
  const dbAll = () => dbRun("readonly", s => s.getAll());
  const dbPut = d => dbRun("readwrite", s => s.put(d));
  const dbDel = n => dbRun("readwrite", s => s.delete(n));
  const dbClear = () => dbRun("readwrite", s => s.clear());

  /* ---- reading files ---- */
  function loadScript(src) {
    return new Promise((res, rej) => {
      if ([...document.scripts].some(s => s.src === src)) return res();
      const el = document.createElement("script"); el.src = src; el.onload = res;
      el.onerror = () => rej(new Error("could not load a helper library (check your internet connection)"));
      document.head.appendChild(el);
    });
  }
  async function extractPdf(file) {
    await loadScript(PDFJS);
    pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
    const pdf = await pdfjsLib.getDocument({data: new Uint8Array(await file.arrayBuffer())}).promise;
    const pages = [];
    for (let n = 1; n <= pdf.numPages; n++) {
      setStatus(`Reading ${file.name}: page ${n} of ${pdf.numPages}…`);
      const tc = await (await pdf.getPage(n)).getTextContent();
      pages.push({page: n, text: tc.items.map(it => it.str + (it.hasEOL ? "\n" : " ")).join("")});
    }
    return pages;
  }
  async function extractDocx(file) {
    await loadScript(MAMMOTH);
    const r = await mammoth.extractRawText({arrayBuffer: await file.arrayBuffer()});
    return [{page: null, text: r.value}];
  }
  async function extractFile(file) {
    const n = file.name.toLowerCase();
    if (n.endsWith(".pdf")) return extractPdf(file);
    if (n.endsWith(".docx")) return extractDocx(file);
    if (/\.(txt|md|csv|tsv|json)$/.test(n)) return [{page: null, text: await file.text()}];
    if (/\.html?$/.test(n)) return [{page: null, text: new DOMParser().parseFromString(await file.text(), "text/html").body.textContent}];
    if (n.endsWith(".doc")) throw new Error("old .doc files are not supported: save it as .docx or PDF");
    throw new Error("unsupported file type (use PDF, .docx, .txt, .md or .csv)");
  }

  /* ---- the document list ---- */
  function renderDocs() {
    docsEl.innerHTML = "";
    for (const d of docs) {
      const chunks = idx.chunks.filter(c => c.doc === d.name).length;
      const li = document.createElement("li");
      li.innerHTML = `<span>📄</span><span class="name">${esc(d.name)}</span><span class="meta">${d.pages.length > 1 || d.pages[0].page ? d.pages.length + " pages · " : ""}${chunks} sections</span>`;
      const b = document.createElement("button"); b.type = "button"; b.textContent = "Remove"; b.onclick = () => removeDoc(d.name);
      li.appendChild(b); docsEl.appendChild(li);
    }
    $("clear").style.display = docs.length ? "" : "none";
  }
  function rebuild() { idx = new UploadIndex(docs); renderDocs(); }
  async function removeDoc(name) {
    docs = docs.filter(d => d.name !== name); rebuild();
    try { await dbDel(name); } catch (e) {}
    setStatus(`Removed ${name}.`);
  }
  async function handleFiles(files) {
    const added = [], errors = [];
    for (const f of files) {
      try {
        setStatus(`Reading ${f.name}…`);
        const pages = await extractFile(f);
        if (!pages.some(p => p.text.trim())) throw new Error("no readable text found (a scanned PDF of images cannot be read)");
        const doc = {name: f.name, pages, added: Date.now()};
        docs = docs.filter(d => d.name !== f.name).concat(doc); added.push(f.name);
        if (canPersist) { try { await dbPut(doc); } catch (e) { canPersist = false; } }
      } catch (e) { errors.push(`${f.name}: ${e.message || e}`); }
    }
    rebuild();
    if (added.length) botSay(`Added ${added.map(n => "**" + n + "**").join(", ")} to the knowledge base (${idx.size} sections in total). Ask me anything about ${added.length > 1 ? "them" : "it"}.`);
    if (errors.length) setStatus("Could not read: " + errors.join(" | "), "err");
    else setStatus((added.length ? `Added ${added.length} document(s). ` : "") + (canPersist ? "They are saved in this browser only." : "They will be forgotten when you close the page."), "ok");
  }

  /* ---- chat ---- */
  function render(md) {
    const out = []; let list = [];
    const flush = () => { if (list.length) { out.push("<ul style='margin:.2em 0 .2em 1.1em;padding:0'>" + list.map(x => `<li>${x}</li>`).join("") + "</ul>"); list = []; } };
    for (const line of md.split("\n")) {
      if (!line.trim()) { flush(); continue; }
      const html = esc(line).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
      if (line.startsWith("- ")) list.push(html.slice(2)); else { flush(); out.push(`<p>${html}</p>`); }
    }
    flush(); return out.join("");
  }
  function add(role, html, extra) {
    const row = document.createElement("div"); row.className = "row " + role;
    row.innerHTML = `<div class="avatar">${role === "user" ? "🙂" : "🤖"}</div><div class="bubble">${html}</div>`;
    if (extra) row.querySelector(".bubble").appendChild(extra);
    chat.appendChild(row); row.scrollIntoView({block: "end", behavior: "smooth"});
  }
  const botSay = md => add("bot", render(md));
  function ask(q) {
    if (!q.trim()) return;
    add("user", `<p>${esc(q)}</p>`);
    const useBuiltin = builtin && $("builtin").checked ? builtin : null;
    const a = answerQuery(useBuiltin, idx, q), extra = document.createElement("div");
    let h = "";
    if (a.context.length) h += `<details><summary>Show the retrieved text (verify this answer yourself)</summary>${a.context.map(c => `<pre>${esc(c)}</pre>`).join("")}</details>`;
    h += `<div class="src">Answered from: ${esc(a.source)}</div>`;
    extra.innerHTML = h;
    add("bot", render(a.text), extra);
  }
  $("form").addEventListener("submit", e => { e.preventDefault(); const q = $("q").value; $("q").value = ""; ask(q); });

  /* ---- upload controls ---- */
  const drop = $("drop");
  $("file").addEventListener("change", e => { handleFiles([...e.target.files]); e.target.value = ""; });
  ["dragenter", "dragover"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", e => handleFiles([...e.dataTransfer.files]));
  $("clear").addEventListener("click", async () => {
    docs = []; rebuild(); try { await dbClear(); } catch (e) {}
    setStatus("All uploaded documents removed.", "ok");
  });

  /* ---- start-up: restore saved uploads, then try to load the built-in UniZulu data ---- */
  (async function start() {
    try { docs = await dbAll(); rebuild(); } catch (e) { canPersist = false; }
    try {
      const get = n => fetch(`data/processed/${n}.json`).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
      const [t, c, ch, l] = await Promise.all(["timetable_entries", "calendar_events", "handbook_chunks", "handbook_lines"].map(get));
      builtin = new KnowledgeBase(t, c, ch, l);
      $("builtinLabel").style.display = "";
      const chips = $("chips");
      for (const ex of ["At what time is 5EEE421L on Monday?", "When does the first semester start?", "What is the entry requirement for engineering?"]) {
        const b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.textContent = ex; b.onclick = () => ask(ex); chips.appendChild(b);
      }
    } catch (e) { /* no built-in data in this repository: uploads only */ }
    setStatus(docs.length ? `Ready: ${docs.length} saved document(s) loaded.` : "Ready. Upload a document to begin" + (builtin ? ", or ask about the built-in UniZulu data." : "."), "ok");
  })();
})();
</script>
</body>
</html>
