name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Rebuild the knowledge files and run the tests
        run: |
          python scripts/build_knowledge.py
          git diff --exit-code data/processed || (echo "data/processed is out of date" && exit 1)
          pytest -q
